[project]
name = "icms-api"
version = "0.1.0"
description = "Local-first Internal Control Management System API"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1.0",
  "uvicorn[standard]>=0.34,<1.0",
  "sqlalchemy>=2.0,<3.0",
  "alembic>=1.14,<2.0",
  "psycopg[binary]>=3.2,<4.0",
  "pydantic-settings>=2.7,<3.0",
  "python-dotenv>=1.0.1,<2.0",
  "email-validator>=2.2,<3.0",
  "python-multipart>=0.0.20,<1.0",
  "PyJWT>=2.10,<3.0",
  "pwdlib[argon2]>=0.2,<1.0",
  "redis>=5.2,<7.0",
  "minio>=7.2,<8.0",
  "httpx>=0.28,<1.0",
  "cryptography>=44,<47",
  "pypdf>=5.4,<7.0",
]

[dependency-groups]
dev = ["pytest>=8.3,<9.0", "httpx>=0.28,<1.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
